<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lionel AI Elite</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ABAS -->
<div id="tabs">
  <button onclick="showTab('chat')">Chat</button>
  <button onclick="showTab('cameras')">Câmeras</button>
  <button onclick="showTab('settings')">Configurações</button>
</div>

<!-- CONTEÚDO -->
<div id="content">

  <!-- CHAT -->
  <div id="chat" class="tab-content">
    <div id="chat-history"></div>
    <input type="text" id="chat-input" placeholder="Escreva aqui..." onkeydown="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">Enviar</button>
    <button onclick="LionelCore.startVoiceMode()">🎤 Voz</button>
    <button onclick="LionelCore.stopVoiceMode()">🛑 Parar Voz</button>
    <input type="file" id="file-upload" multiple onchange="uploadFiles(this.files)">
  </div>

  <!-- CÂMERAS -->
  <div id="cameras" class="tab-content" style="display:none;">
    <div id="camera-list"></div>
    <input type="text" id="camera-ip" placeholder="Digite o IP da câmera">
    <button onclick="CameraManager.addCamera()">Adicionar Câmera</button>
  </div>

  <!-- CONFIGURAÇÕES -->
  <div id="settings" class="tab-content" style="display:none;">
    <input type="text" id="api-key" placeholder="Insira sua API do Gemini">
    <button onclick="LionelSettings.saveApiKey(document.getElementById('api-key').value)">Salvar API</button>
    <input type="text" id="user-name" placeholder="Digite seu nome">
    <button onclick="LionelSettings.saveUserName(document.getElementById('user-name').value)">Salvar Nome</button>
    <select id="voice-select" onchange="LionelSettings.changeVoice(this.value)">
      <option value="default">Padrão</option>
      <option value="male">Masculina</option>
      <option value="female">Feminina</option>
    </select>
  </div>

</div>

<script src="js/memory.js"></script>
<script src="js/settings.js"></script>
<script src="js/voice.js"></script>
<script src="js/stt.js"></script>
<script src="js/camera.js"></script>
<script src="js/proactive.js"></script>
<script src="js/assistant.js"></script>
<script src="js/index.js"></script>
</body>
</html>
