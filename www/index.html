<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionel</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 12px;
  text-align: center;
  background: linear-gradient(90deg, #1a1a1a, #2a1f0f);
  color: #d4af37;
  font-weight: bold;
  position: relative;
}

#settingsBtn {
  position: absolute;
  right: 12px;
  top: 10px;
  background: none;
  border: none;
  color: #d4af37;
  font-size: 20px;
}

#chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
}

.user { background: #1e1e2e; margin-left: auto; }
.lionel { background: #2a1f0f; color: #f0d77a; }

footer {
  display: flex;
  gap: 6px;
  padding: 8px;
  background: #111;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  font-size: 18px;
  background: #d4af37;
}

#cameraBox {
  display: none;
  background: black;
}

video {
  width: 100%;
}

#settings {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  padding: 20px;
}
</style>
</head>

<body>

<header>
👁️ Lionel — companheiro
<button id="settingsBtn">⚙️</button>
</header>

<div id="cameraBox">
<video id="video" autoplay muted></video>
</div>

<div id="chat"></div>

<footer>
<input id="input" placeholder="Fale ou digite…" />
<button id="micBtn">🎤</button>
<button id="camBtn">📷</button>
</footer>

<div id="settings">
<h3>Configurações</h3>
<input id="aiName" placeholder="Nome do assistente">
<input id="apiKey" placeholder="Chave da API">
<button onclick="saveSettings()">Salvar</button>
<button onclick="closeSettings()">Fechar</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
const camBtn = document.getElementById("camBtn");
const video = document.getElementById("video");
const cameraBox = document.getElementById("cameraBox");

let cameraOn = false;

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
}

function lionelReply(text) {
  let reply = "Estou aqui com você.";
  if (cameraOn) reply = "Estou te vendo agora.";
  addMessage(reply, "lionel");
  speak(reply);
}

/* VOZ */
let recognition;
if ("webkitSpeechRecognition" in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    addMessage(text, "user");
    lionelReply(text);
  };
}

micBtn.onclick = () => recognition && recognition.start();

/* CÂMERA */
camBtn.onclick = async () => {
  if (!cameraOn) {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    cameraBox.style.display = "block";
    cameraOn = true;
    addMessage("Câmera ativada.", "lionel");
    speak("Câmera ativada.");
    analyzeEnvironment();
  } else {
    video.srcObject.getTracks().forEach(t => t.stop());
    cameraBox.style.display = "none";
    cameraOn = false;
    addMessage("Câmera desligada.", "lionel");
    speak("Câmera desligada.");
  }
};

/* ANÁLISE SIMPLES */
function analyzeEnvironment() {
  if (!cameraOn) return;
  setTimeout(() => {
    addMessage("Percebo movimento ou presença.", "lionel");
    speak("Percebo movimento ou presença.");
    analyzeEnvironment();
  }, 15000);
}

/* CONFIG */
const settings = document.getElementById("settings");
document.getElementById("settingsBtn").onclick = () => settings.style.display = "block";
function closeSettings(){ settings.style.display="none"; }
function saveSettings(){
  localStorage.setItem("lionel_api", apiKey.value);
  localStorage.setItem("lionel_name", aiName.value);
  closeSettings();
}

addMessage("Oi. Pode falar comigo quando quiser.", "lionel");
speak("Oi. Pode falar comigo quando quiser.");
</script>

</body>
</html>
