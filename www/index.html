<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionel</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #f5f5f5;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 12px;
  background: linear-gradient(90deg,#1a1a1a,#2a1f0f);
  color: #d4af37;
  text-align: center;
  font-weight: bold;
}

#chat {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 10px;
  max-width: 80%;
  padding: 10px;
  border-radius: 10px;
}

.user {
  background: #1e1e2e;
  margin-left: auto;
}

.lionel {
  background: #2a1f0f;
  color: #f0d77a;
}

footer {
  display: flex;
  padding: 10px;
  background: #111;
  gap: 8px;
}

button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #d4af37;
  font-weight: bold;
}
</style>
</head>

<body>

<header>👁️ Lionel — Modo Companheiro</header>

<div id="chat"></div>

<footer>
  <button onclick="startCompanion()">▶️ Iniciar Modo Companheiro</button>
  <button onclick="stopCompanion()">⛔ Parar</button>
</footer>

<script>
const chat = document.getElementById("chat");

function addMessage(text, who){
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
}

let recognition;
let companionActive = false;

if ("webkitSpeechRecognition" in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    if (!companionActive) return;

    const text = event.results[event.results.length - 1][0].transcript;
    addMessage(text, "user");

    // Comentário proativo
    setTimeout(() => {
      const reply = generateComment(text);
      addMessage(reply, "lionel");
      speak(reply);
    }, 700);
  };
}

function generateComment(text){
  const lower = text.toLowerCase();

  if (lower.includes("número")) return "Quer que eu salve esse número pra você?";
  if (lower.includes("hora") || lower.includes("horas")) return "Quer que eu crie um alarme pra isso?";
  if (lower.includes("difícil")) return "Percebi um clima tenso aí… quer ajuda pra responder?";
  if (lower.includes("engraçado")) return "Confesso que essa foi boa 😄";

  return "Entendi… estou acompanhando aqui.";
}

function startCompanion(){
  if (!recognition) {
    alert("Reconhecimento de voz não disponível.");
    return;
  }
  companionActive = true;
  addMessage("Modo companheiro ativado. Estou ouvindo.", "lionel");
  speak("Modo companheiro ativado. Estou ouvindo.");
  recognition.start();
}

function stopCompanion(){
  companionActive = false;
  if (recognition) recognition.stop();
  addMessage("Modo companheiro desativado.", "lionel");
  speak("Modo companheiro desativado.");
}
</script>

</body>
</html>
