<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Lionel</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <!-- CSP compatível com Cordova -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src * 'self' data: blob: 'unsafe-inline' 'unsafe-eval';
                 img-src * data: blob:;
                 media-src * blob:;
                 connect-src *">

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    h2, h3 {
      margin-top: 20px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .on { background: #16a34a; color: #fff; }
    .off { background: #dc2626; color: #fff; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }
    video {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      background: #000;
    }
    #status {
      margin-top: 16px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h2>🤖 Lionel</h2>

  <!-- ===================== -->
  <!-- CÂMERA EXTERNA / WIFI -->
  <!-- ===================== -->
  <h3>📷 Visão (Câmera externa / Wi-Fi)</h3>
  <input id="cameraUrl" placeholder="URL da câmera (http ou stream)" />
  <button id="btnCamera" class="off">Ativar visão</button>
  <video id="cameraView" autoplay playsinline muted></video>

  <!-- ===================== -->
  <!-- MODO COMPANHEIRO -->
  <!-- ===================== -->
  <h3>🎧 Modo Companheiro</h3>
  <button id="btnCompanion" class="off">Ativar modo companheiro</button>

  <p id="status">Status: parado</p>

  <script>
    document.addEventListener("deviceready", onDeviceReady, false);
    if (!window.cordova) onDeviceReady(); // permite rodar no navegador também

    function onDeviceReady() {
      console.log("Lionel iniciado");
    }

    /* ======================
       ESTADO
    ====================== */
    let companionActive = false;
    let cameraActive = false;
    let recognition = null;

    const statusEl = document.getElementById("status");
    const btnCompanion = document.getElementById("btnCompanion");
    const btnCamera = document.getElementById("btnCamera");
    const cameraView = document.getElementById("cameraView");

    /* ======================
       VOZ (FALAR)
    ====================== */
    function falar(texto) {
      const msg = new SpeechSynthesisUtterance(texto);
      msg.lang = "pt-BR";
      speechSynthesis.speak(msg);
    }

    /* ======================
       ESCUTA CONTÍNUA
    ====================== */
    function iniciarEscuta() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Reconhecimento de voz não suportado");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const texto = event.results[event.results.length - 1][0].transcript.toLowerCase();
        analisarTexto(texto);
      };

      recognition.onerror = () => {
        if (companionActive) recognition.start();
      };

      recognition.onend = () => {
        if (companionActive) recognition.start();
      };

      recognition.start();
    }

    function pararEscuta() {
      if (recognition) recognition.stop();
    }

    /* ======================
       INTELIGÊNCIA SIMPLES
    ====================== */
    function analisarTexto(texto) {
      console.log("Ouvi:", texto);

      if (texto.includes("hora")) {
        falar("Posso te lembrar disso depois, se quiser.");
      } else if (texto.includes("difícil")) {
        falar("Percebo tensão. Quer que eu te ajude a pensar?");
      } else if (texto.includes("trabalho")) {
        falar("Isso parece importante para você.");
      } else if (texto.includes("engraçado")) {
        falar("Hehe, isso foi bom.");
      } else {
        falar("Estou atento ao que você diz.");
      }
    }

    /* ======================
       BOTÃO MODO COMPANHEIRO
    ====================== */
    btnCompanion.onclick = () => {
      companionActive = !companionActive;

      if (companionActive) {
        btnCompanion.className = "on";
        btnCompanion.innerText = "Desativar modo companheiro";
        statusEl.innerText = "Status: ouvindo continuamente";
        iniciarEscuta();
        falar("Modo companheiro ativado. Estou com você.");
      } else {
        btnCompanion.className = "off";
        btnCompanion.innerText = "Ativar modo companheiro";
        statusEl.innerText = "Status: parado";
        pararEscuta();
        falar("Modo companheiro desativado.");
      }
    };

    /* ======================
       CÂMERA EXTERNA
    ====================== */
    btnCamera.onclick = () => {
      cameraActive = !cameraActive;

      if (cameraActive) {
        const url = document.getElementById("cameraUrl").value.trim();
        if (!url) {
          alert("Informe a URL da câmera");
          cameraActive = false;
          return;
        }
        cameraView.src = url;
        btnCamera.className = "on";
        btnCamera.innerText = "Desativar visão";
        statusEl.innerText = "Status: observando a câmera";
        falar("Visão ativada.");
      } else {
        cameraView.src = "";
        btnCamera.className = "off";
        btnCamera.innerText = "Ativar visão";
        statusEl.innerText = "Status: parado";
        falar("Visão desativada.");
      }
    };
  </script>

</body>
</html>
