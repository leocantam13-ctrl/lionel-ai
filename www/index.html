<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lionel</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(90deg, #1a1a1a, #2a1f00);
      padding: 12px;
      text-align: center;
      font-weight: bold;
      color: #d4af37;
      font-size: 18px;
    }

    #tabs {
      display: flex;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      color: #aaa;
    }

    .tab.active {
      color: #d4af37;
      border-bottom: 2px solid #d4af37;
    }

    .view {
      flex: 1;
      display: none;
      flex-direction: column;
    }

    .view.active {
      display: flex;
    }

    #chat {
      padding: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .bubble {
      max-width: 75%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 12px;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #2a2a2a;
    }

    .lionel {
      align-self: flex-start;
      background: #1f1f1f;
      border: 1px solid #d4af37;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #333;
    }

    #textInput {
      flex: 1;
      padding: 10px;
      background: #000;
      color: #fff;
      border: none;
      outline: none;
    }

    #sendBtn {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 0 16px;
      cursor: pointer;
    }

    .panel {
      padding: 15px;
    }

    button {
      background: #d4af37;
      border: none;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>LIONEL</header>

  <div id="tabs">
    <div class="tab active" onclick="showTab('chatView')">Chat</div>
    <div class="tab" onclick="showTab('cameraView')">Câmeras</div>
    <div class="tab" onclick="showTab('settingsView')">Configurações</div>
  </div>

  <!-- CHAT -->
  <div id="chatView" class="view active">
    <div id="chat"></div>

    <div id="inputArea">
      <input id="textInput" placeholder="Digite ou fale..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <!-- CAMERAS -->
  <div id="cameraView" class="view">
    <div class="panel">
      <p>Câmeras conectadas aparecerão aqui.</p>
      <p>(IP / Wi-Fi – integração futura)</p>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settingsView" class="view">
    <div class="panel">
      <p>Configurações do Lionel</p>
      <button onclick="LionelVoice.startListening()">Ativar Voz</button>
      <button onclick="LionelVoice.stopListening()">Desativar Voz</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/memory.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/index.js"></script>

  <script>
    function showTab(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }

    const chat = document.getElementById("chat");
    const input = document.getElementById("textInput");

    document.getElementById("sendBtn").onclick = () => {
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, "user");
      LionelCore.handleUserText(text);
      input.value = "";
    };

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Expor para o core usar
    window.addLionelBubble = text => addBubble(text, "lionel");
  </script>

</body>
</html>
