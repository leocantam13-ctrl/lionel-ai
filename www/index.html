<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionel</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #f5f5f5;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 12px;
  background: linear-gradient(90deg,#1a1a1a,#2a1f0f);
  color: #d4af37;
  text-align: center;
  font-weight: bold;
}

video {
  width: 100%;
  max-height: 220px;
  background: black;
}

#chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 8px;
  max-width: 80%;
  padding: 10px;
  border-radius: 10px;
}

.user { background: #1e1e2e; margin-left: auto; }
.lionel { background: #2a1f0f; color: #f0d77a; }

footer {
  display: flex;
  gap: 6px;
  padding: 8px;
  background: #111;
}

button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #d4af37;
  font-weight: bold;
}
</style>
</head>

<body>

<header>👁️ Lionel — Companheiro Consciente</header>

<video id="video" autoplay playsinline muted></video>

<div id="chat"></div>

<footer>
  <button onclick="toggleCellCamera()">📷 Celular</button>
  <button onclick="connectIP()">🌐 IP</button>
  <button onclick="startCompanion()">🎧 Ouvir</button>
  <button onclick="stopCompanion()">⛔</button>
</footer>

<script>
const chat = document.getElementById("chat");
const video = document.getElementById("video");

function add(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
}

/* =====================
   CÂMERA DO CELULAR
===================== */
let stream = null;

async function toggleCellCamera(){
  if (stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    add("Pare de ver.", "lionel");
    speak("Câmera desligada.");
    return;
  }

  stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  add("Estou vendo você agora.", "lionel");
  speak("Estou vendo você agora.");
}

/* =====================
   CÂMERA IP / WI-FI
===================== */
function connectIP(){
  const url = prompt("Cole a URL da câmera IP (MJPEG ou M3U8):");
  if (!url) return;

  video.srcObject = null;
  video.src = url;
  video.play();

  add("Conectado à câmera Wi-Fi.", "lionel");
  speak("Conectado à câmera Wi-Fi.");
}

/* =====================
   MODO COMPANHEIRO
===================== */
let recognition;
let active = false;

if ("webkitSpeechRecognition" in window){
  recognition = new webkitSpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = true;

  recognition.onresult = e => {
    if (!active) return;
    const text = e.results[e.results.length-1][0].transcript;
    add(text, "user");

    const reply = comment(text);
    add(reply, "lionel");
    speak(reply);
  };
}

function comment(text){
  const t = text.toLowerCase();

  if (t.includes("hora")) return "Parece um assunto de tempo, quer que eu lembre depois?";
  if (t.includes("difícil")) return "O clima parece pesado, quer ajuda pra responder?";
  if (t.includes("trabalho")) return "Isso soa importante.";
  if (t.includes("engraçado")) return "Isso foi engraçado mesmo 😄";

  return "Estou atento ao que está acontecendo.";
}

function startCompanion(){
  active = true;
  recognition.start();
  add("Estou ouvindo ativamente.", "lionel");
  speak("Estou ouvindo ativamente.");
}

function stopCompanion(){
  active = false;
  if (recognition) recognition.stop();
  add("Modo companheiro desligado.", "lionel");
  speak("Modo companheiro desligado.");
}
</script>

</body>
</html>
