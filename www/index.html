<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionel</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 12px;
  text-align: center;
  background: linear-gradient(90deg, #1a1a1a, #2a1f0f);
  color: #d4af37;
  font-weight: bold;
}

#chat {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 10px;
  max-width: 80%;
  padding: 10px;
  border-radius: 10px;
}

.user {
  background: #1e1e2e;
  margin-left: auto;
}

.lionel {
  background: #2a1f0f;
  color: #f0d77a;
}

footer {
  display: flex;
  padding: 10px;
  background: #111;
  gap: 8px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #d4af37;
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>👁️ Lionel — companheiro</header>

<div id="chat"></div>

<footer>
  <input id="input" placeholder="Fale ou digite…" />
  <button id="micBtn">🎤</button>
  <button id="companionBtn">🧠</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
const companionBtn = document.getElementById("companionBtn");

let companionMode = false;
let lastUserInteraction = Date.now();
let lastLionelSpeak = Date.now();

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-BR";
    speechSynthesis.speak(u);
  }
}

function lionelReply(text) {
  addMessage(text, "lionel");
  speak(text);
  lastLionelSpeak = Date.now();
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && input.value.trim()) {
    const text = input.value;
    input.value = "";
    addMessage(text, "user");
    lastUserInteraction = Date.now();
    lionelReply("Entendi.");
  }
});

let recognition;
if ("webkitSpeechRecognition" in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = false;

  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    addMessage(text, "user");
    lastUserInteraction = Date.now();
    lionelReply("Estou com você.");
  };
}

micBtn.onclick = () => {
  if (recognition) recognition.start();
};

companionBtn.onclick = () => {
  companionMode = !companionMode;
  companionBtn.style.background = companionMode ? "#f0d77a" : "#d4af37";
  lionelReply(companionMode ? 
    "Modo companheiro ativado." : 
    "Modo companheiro desativado."
  );
};

// PROATIVIDADE
setInterval(() => {
  if (!companionMode) return;

  const now = Date.now();
  const silence = now - lastUserInteraction;

  if (silence > 20000 && now - lastLionelSpeak > 25000) {
    lionelReply("Tô aqui com você. Tudo bem por aí?");
  }
}, 5000);

lionelReply("Oi. Pode falar comigo quando quiser.");
</script>

</body>
</html>
