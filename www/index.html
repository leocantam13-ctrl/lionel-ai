<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lionel v4 - Sentinela Proativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffcc00; --dark: #0a0a0a; --card: #161616; --user-bg: #2b2b2b; --text: #f0f0f0; }
        body { background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header Profissional */
        header { padding: 20px; background: rgba(10, 10, 10, 0.95); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
        .lion-brand { display: flex; align-items: center; gap: 10px; font-weight: bold; color: var(--gold); letter-spacing: 1px; }
        .status { font-size: 0.7em; color: #00ff00; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }

        /* Area de Chat */
        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 15px; border-radius: 18px; line-height: 1.5; font-size: 1rem; position: relative; }
        .lionel-msg { align-self: flex-start; background: transparent; border: 1px solid #333; border-bottom-left-radius: 4px; }
        .user-msg { align-self: flex-end; background: var(--user-bg); border-bottom-right-radius: 4px; }
        .chat-date { text-align: center; font-size: 0.7em; color: #666; margin: 10px 0; }

        /* Barra de Input Estilo GPT */
        .input-box { padding: 20px; background: var(--dark); border-top: 1px solid #333; }
        .input-container { background: var(--card); border-radius: 30px; display: flex; align-items: center; padding: 5px 15px; border: 1px solid #444; transition: 0.3s; }
        .input-container:focus-within { border-color: var(--gold); }
        #userInput { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; }
        .action-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; padding: 8px; transition: 0.2s; }
        .action-btn:hover { color: var(--gold); }

        /* Painel de Configurações (Slide Up) */
        .settings-overlay { position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--card); border-top: 2px solid var(--gold); transition: 0.4s; z-index: 1000; padding-bottom: 30px; }
        .settings-overlay.active { bottom: 0; }
        .settings-content { padding: 25px; }
    </style>
</head>
<body>

<header>
    <div class="lion-brand"><i class="fas fa-shield-cat"></i> LIONEL V4</div>
    <div class="status"><span style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%;"></span> Kwami Online</div>
    <button class="action-btn" onclick="toggleMenu()"><i class="fas fa-sliders"></i></button>
</header>

<div id="chat-flow">
    <div class="chat-date">Hoje, 15 de Janeiro de 2026</div>
    <div class="msg lionel-msg">Sistema inicializado, Léo. Estou ouvindo seu ambiente e pronto para ser seu Sentinela. Como vamos evoluir hoje?</div>
</div>

<div class="input-box">
    <div class="input-container">
        <button class="action-btn"><i class="fas fa-plus-circle"></i></button>
        <input type="text" id="userInput" placeholder="Dar nova ordem ao Lionel...">
        <button class="action-btn" id="sendBtn"><i class="fas fa-arrow-up-circle"></i></button>
    </div>
</div>

<div id="settings" class="settings-overlay">
    <div class="settings-content">
        <h3><i class="fas fa-cog"></i> Central de Comando</h3>
        <label>Persona/Nome do Usuário</label>
        <input type="text" id="userName" placeholder="Ex: Léo">
        
        <label>Microfone Principal</label>
        <select id="audioSource">
            <option>Celular</option>
            <option>Bluetooth (Fone/Pin)</option>
            <option>Rede Wi-Fi</option>
        </select>

        <label>Câmeras (Dê nomes para vigia)</label>
        <input type="text" placeholder="Nome da Câmera 1 (ex: Óculos)">
        <input type="text" placeholder="Nome da Câmera 2 (ex: Sala)">
        
        <button onclick="saveConfig()" style="width: 100%; background: var(--gold); padding: 15px; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px;">SALVAR EVOLUÇÃO</button>
    </div>
</div>

<script src="cordova.js"></script>
<script src="js/index.js"></script>
</body>
</html>
