<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lionel</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 12px;
      text-align: center;
      background: linear-gradient(90deg, #1a1a1a, #2a1f0f);
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 1px;
      position: relative;
    }

    #settingsBtn {
      position: absolute;
      right: 12px;
      top: 10px;
      background: transparent;
      border: none;
      color: #d4af37;
      font-size: 20px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 10px;
      max-width: 80%;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.4;
    }

    .user {
      background: #1e1e2e;
      align-self: flex-end;
      margin-left: auto;
    }

    .lionel {
      background: #2a1f0f;
      color: #f0d77a;
      align-self: flex-start;
    }

    footer {
      display: flex;
      padding: 10px;
      background: #111;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      background: #d4af37;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 20px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    #settings {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      color: #fff;
      padding: 20px;
      z-index: 999;
    }

    #settings input {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 6px;
      border: none;
    }
  </style>
</head>

<body>

  <header>
    👁️ Lionel — seu companheiro
    <button id="settingsBtn">⚙️</button>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="input" placeholder="Digite ou toque no microfone…" />
    <button id="micBtn">🎤</button>
  </footer>

  <!-- CONFIGURAÇÕES -->
  <div id="settings">
    <h3>Configurações do Lionel</h3>

    <label>Nome do assistente</label>
    <input id="aiName" placeholder="Lionel" />

    <label>Chave da API</label>
    <input id="apiKey" placeholder="sk-..." />

    <button onclick="saveSettings()">Salvar</button>
    <button onclick="closeSettings()">Fechar</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const micBtn = document.getElementById("micBtn");

    const settingsDiv = document.getElementById("settings");
    const settingsBtn = document.getElementById("settingsBtn");
    const apiKeyInput = document.getElementById("apiKey");
    const aiNameInput = document.getElementById("aiName");

    function getAIName() {
      return localStorage.getItem("lionel_name") || "Lionel";
    }

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function lionelReply(userText) {
      setTimeout(() => {
        const reply = "Entendi. Estou aqui com você.";
        addMessage(reply, "lionel");
        speak(reply);
      }, 600);
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && input.value.trim() !== "") {
        const text = input.value;
        input.value = "";
        addMessage(text, "user");
        lionelReply(text);
      }
    });

    let recognition;
    if ("webkitSpeechRecognition" in window) {
      recognition = new webkitSpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        addMessage(text, "user");
        lionelReply(text);
      };
    }

    micBtn.onclick = () => {
      if (recognition) recognition.start();
      else alert("Reconhecimento de voz não disponível.");
    };

    function speak(text) {
      if ("speechSynthesis" in window) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "pt-BR";
        speechSynthesis.speak(utter);
      }
    }

    settingsBtn.onclick = () => {
      apiKeyInput.value = localStorage.getItem("lionel_api") || "";
      aiNameInput.value = localStorage.getItem("lionel_name") || "Lionel";
      settingsDiv.style.display = "block";
    };

    function closeSettings() {
      settingsDiv.style.display = "none";
    }

    function saveSettings() {
      localStorage.setItem("lionel_api", apiKeyInput.value);
      localStorage.setItem("lionel_name", aiNameInput.value);
      alert("Configurações salvas");
      closeSettings();
    }

    addMessage("Oi. Pode falar comigo quando quiser.", "lionel");
    speak("Oi. Pode falar comigo quando quiser.");
  </script>

</body>
</html>
