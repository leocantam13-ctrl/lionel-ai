<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lionel v4 Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffcc00; --dark: #0a0a0a; --card: #151515; --text: #f0f0f0; }
        body { background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        #camera-monitor { width:100%; height:180px; background:#000; border-bottom:1px solid #333; position:relative; }
        #video-preview { width:100%; height:100%; object-fit:cover; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #080808; }
        .msg { padding: 12px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; }
        .lionel-msg { align-self: flex-start; background: #222; border: 1px solid #333; color: var(--gold); }
        .user-msg { align-self: flex-end; background: var(--gold); color: #000; }
        #settings { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 2000; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        .btn-save { background: var(--gold); color: black; font-weight: bold; padding: 15px; border: none; width: 100%; border-radius: 10px; cursor: pointer; }
        .input-box { padding: 15px; background: var(--card); display: flex; gap: 10px; align-items: center; }
        .main-input { flex: 1; background: #222; border: none; padding: 12px; border-radius: 25px; color: white; outline: none; }
    </style>
</head>
<body>
<header>
    <div style="color:var(--gold); font-weight:bold;"><i class="fas fa-lion"></i> LIONEL V4</div>
    <button onclick="toggleMenu()" style="background:none; border:none; color:var(--gold); font-size:1.4rem;"><i class="fas fa-sliders"></i></button>
</header>
<div id="camera-monitor">
    <video id="video-preview" autoplay playsinline></video>
    <div id="cam-label" style="position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.5); font-size:10px; padding:3px;">Câmera: Dia a Dia</div>
</div>
<div id="settings">
    <h2 style="color:var(--gold);">Painel de Controle</h2>
    <label>API Key:</label><input type="password" id="apiKey">
    <label>Nome do Usuário:</label><input type="text" id="userName">
    <label>Personalidade/Bio:</label><textarea id="aiBio"></textarea>
    <label>Fonte de Áudio:</label>
    <select id="audioSource"><option value="phone">Celular</option><option value="bt">Bluetooth</option></select>
    <button class="btn-save" onclick="saveAll()">SALVAR E ATIVAR</button>
    <button onclick="toggleMenu()" style="color:gray; background:none; border:none; width:100%; margin-top:15px;">Voltar</button>
</div>
<div id="chat-flow"></div>
<div class="input-box">
    <button onclick="captureFile()" style="background:none; border:none; color:gray;"><i class="fas fa-paperclip"></i></button>
    <input type="text" id="mainInput" class="main-input" placeholder="Comandar Lionel...">
    <button onclick="processInput()" style="background:none; border:none; color:var(--gold); font-size:1.5rem;"><i class="fas fa-arrow-up-circle"></i></button>
</div>
<script src="cordova.js"></script>
<script src="js/index.js"></script>
<script src="js/accessibility.js"></script>
</body>
</html>
