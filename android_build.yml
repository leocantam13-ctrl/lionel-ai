name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - run: npm install -g cordova
    - run: npm install

    # Remove Android se existir
    - run: cordova platform rm android || true

    # Adiciona Android (gera gradlew automaticamente)
    - run: cordova platform add android@11.0.0

    # Suprime aviso de compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # Build do APK (release)
    - run: cordova build android --release

    # Upload do APK
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
