name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Pega o código do repositório
    - uses: actions/checkout@v4

    # 2️⃣ Configura Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3️⃣ Configura Java
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 4️⃣ Instala Cordova e dependências do projeto
    - run: npm install -g cordova
    - run: npm install

    # 5️⃣ Limpa e adiciona a plataforma Android
    - run: cordova platform rm android || true
    - run: cordova platform add android@11.0.0

    # 6️⃣ Força Gradle 8.2 no wrapper da plataforma Android
    - run: |
        cd platforms/android
        ./gradlew wrapper --gradle-version 8.2
        cd ../..

    # 7️⃣ Cria gradle.properties para suprimir aviso de compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # 8️⃣ Instala build-tools e platform (necessário para compilação)
    - name: Instalar Build Tools e Platform
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;32.0.0" "platforms;android-33"

    # 9️⃣ Build do APK debug
    - run: cordova build android

    # 🔟 Upload do APK gerado
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
