name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # Instala Cordova localmente e dependências
    - run: npm ci
    - run: npx cordova -v  # só pra conferir versão

    # Remove Android se já existir
    - run: npx cordova platform rm android || true

    # Adiciona Android versão fixa 11
    - run: npx cordova platform add android@11.0.0

    # Instala SDK necessário e aceita licenças
    - run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
    - run: yes | sdkmanager --licenses

    # Suprime aviso de compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # Build do APK release
    - run: npx cordova build android --release

    # Upload do APK
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
