# LIONEL V4 ELITE - BUILD CORRIGIDO 2026

name: Build Lionel APK
on:
  push:
    branches: [ main, principal ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova
        run: |
          cordova platform remove android || true
          cordova platform add android@14.0.1
          # Plugins compatíveis
          cordova plugin add cordova-plugin-camera@^7.0.0
          cordova plugin add cordova-plugin-file@^8.1.0
          cordova plugin add cordova-plugin-background-mode@^0.7.3
          cordova plugin add cordova-plugin-device@^2.0.3
          cordova plugin add cordova-plugin-android-permissions@^1.1.5
          cordova plugin add cordova-plugin-whitelist@^1.3.5

      - name: Build APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lionel-app-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
