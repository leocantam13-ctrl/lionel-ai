name: Build APK Lionel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Baixa o código do repositório
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Configura Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3️⃣ Configura Java 17 (compatível com Cordova)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 4️⃣ Instala Cordova globalmente
    - name: Install Cordova
      run: npm install -g cordova

    # 5️⃣ Instala dependências do projeto
    - name: Install npm dependencies
      run: npm install

    # 6️⃣ Remove Android se já existir (evita conflito)
    - name: Remove Android platform if exists
      run: cordova platform rm android || true

    # 7️⃣ Adiciona Android (versão estável)
    - name: Add Android platform
      run: npx cordova platform add android@11.0.0

    # 8️⃣ FORÇA compileSdk / targetSdk compatível com AndroidX
    - name: Force Android SDK versions
      run: |
        echo "cdvCompileSdkVersion=34" >> platforms/android/gradle.properties
        echo "cdvTargetSdkVersion=34" >> platforms/android/gradle.properties
        echo "android.suppressUnsupportedCompileSdk=34" >> platforms/android/gradle.properties

    # 9️⃣ Build do APK em modo release
    - name: Build Release APK
      run: npx cordova build android --release

    # 🔟 Upload do APK gerado
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
