name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Pega o código do repositório
    - uses: actions/checkout@v4

    # 2️⃣ Instala Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3️⃣ Instala Java (Temurin 17)
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 4️⃣ Instala Cordova globalmente
    - run: npm install -g cordova

    # 5️⃣ Instala dependências do projeto
    - run: npm install

    # 6️⃣ Instala Gradle 8.2 para evitar XmlParser quebrado
    - name: Instalar Gradle 8.2
      run: |
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    # 7️⃣ Limpa plataforma Android antiga
    - run: cordova platform rm android || true

    # 8️⃣ Adiciona Cordova Android atualizado
    - run: cordova platform add android@11.0.0

    # 9️⃣ Cria gradle.properties para suprimir aviso do compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # 🔟 Build do APK debug usando gradle 8.2
    - run: cordova build android

    # 1️⃣1️⃣ Upload do APK como artifact
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
