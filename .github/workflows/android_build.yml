name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - run: npm install -g cordova
    - run: npm install

    # 1️⃣ Remove Android se existir
    - run: cordova platform rm android || true

    # 2️⃣ Adiciona Android (gera gradlew automaticamente)
    - run: cordova platform add android@11.0.0

    # 3️⃣ (Opcional) força versão do Gradle se precisar
    - run: |
        cd platforms/android
        ./gradlew wrapper --gradle-version 8.2
        cd ../..

    # 4️⃣ Suprime aviso de compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # 5️⃣ Build do APK
    - run: cordova build android --release

    # 6️⃣ Upload do APK
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
