name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - run: npm install -g cordova
    - run: npm install

    # Instalar Command Line Tools do Android
    - name: Instalar Command Line Tools
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip
        mv cmdline-tools latest
        rm cmdline-tools.zip

    # Instalar Build Tools e Platforms
    - name: Instalar Build Tools e Platform
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;32.0.0" "platforms;android-33"

    # Remove a plataforma Android antiga
    - run: cordova platform rm android || true

    # Adiciona Cordova Android atualizado
    - run: cordova platform add android@11.0.0

    # Suprimir warning do compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # Build do APK debug
    - run: cordova build android

    # Upload do APK gerado
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
