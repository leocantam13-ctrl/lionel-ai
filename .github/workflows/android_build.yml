name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Pega o código do repositório
    - uses: actions/checkout@v4

    # 2️⃣ Instala Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3️⃣ Instala Java JDK 17 (Temurin)
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 4️⃣ Instala Cordova globalmente
    - run: npm install -g cordova

    # 5️⃣ Instala dependências do projeto
    - run: npm install

    # 6️⃣ Instala Gradle 8.2 (compatível com Cordova)
    - name: Instalar Gradle 8.2
      run: |
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    # 7️⃣ Instala Android Build Tools e Platform corretos
    - name: Instalar Build Tools e Platform
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        yes | sdkmanager --sdk_root=$ANDROID_HOME "build-tools;32.0.0" "platforms;android-33"

    # 8️⃣ Remove a plataforma Android antiga
    - run: cordova platform rm android || true

    # 9️⃣ Adiciona Cordova Android atualizado
    - run: cordova platform add android@11.0.0

    # 🔟 Cria gradle.properties para suprimir warning do compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # 1️⃣1️⃣ Build do APK debug
    - run: cordova build android

    # 1️⃣2️⃣ Upload do APK gerado como artifact
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
