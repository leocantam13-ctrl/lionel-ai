name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Pega o código do repositório
    - uses: actions/checkout@v4

    # Configura Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # Configura Java 17 (Temurin)
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # Instala Cordova globalmente
    - run: npm install -g cordova

    # Instala dependências do projeto
    - run: npm install

    # Remove plataforma Android se existir
    - run: cordova platform rm android || true

    # Adiciona a plataforma Android 11
    - run: npx cordova platform add android@11.0.0

    # Suprime aviso de compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # Build do APK em modo release
    - run: npx cordova build android --release

    # Upload do APK gerado
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
