name: Build APK Lionel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Pega o código
    - uses: actions/checkout@v4

    # 2️⃣ Configura Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3️⃣ Configura Java
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 4️⃣ Instala Cordova
    - run: npm install -g cordova
    - run: npm install

    # 5️⃣ Remove Android se existir
    - run: cordova platform rm android || true

    # 6️⃣ Adiciona Android (gera gradlew automaticamente)
    - run: cordova platform add android@11.0.0

    # 7️⃣ (Opcional) força versão do Gradle compatível
    - run: |
        cd platforms/android
        ./gradlew wrapper --gradle-version 8.2
        cd ../..

    # 8️⃣ Suprime aviso de compileSdk
    - run: echo "android.suppressUnsupportedCompileSdk=35" >> platforms/android/gradle.properties

    # 9️⃣ Build do APK (release)
    - run: cordova build android --release

    # 🔟 Upload do APK gerado
    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
