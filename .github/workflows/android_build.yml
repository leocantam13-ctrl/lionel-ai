name: Build APK Lionel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Cordova
      run: npm install -g cordova

    - name: Install dependencies
      run: npm install

    - name: Remove Android platform
      run: cordova platform rm android || true

    - name: Add Android platform
      run: npx cordova platform add android@11.0.0

    # 🔴 PARTE CRÍTICA: FORÇA GRADLE COMPATÍVEL
    - name: Force Gradle 7.6.4
      run: |
        cd platforms/android
        mkdir -p gradle/wrapper
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.4-all.zip" > gradle/wrapper/gradle-wrapper.properties

    - name: Set Android SDK versions
      run: |
        echo "cdvCompileSdkVersion=34" >> platforms/android/gradle.properties
        echo "cdvTargetSdkVersion=34" >> platforms/android/gradle.properties

    - name: Build APK
      run: npx cordova build android --release

    - uses: actions/upload-artifact@v4
      with:
        name: lionel-apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
